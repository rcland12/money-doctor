# Money Doctor behind nginx and oauth2-proxy (single sign-on, MD_AUTH=proxy).
# Set in .env: MD_NGINX_CONF=money-doctor-sso.conf, MD_AUTH=proxy,
# MD_PROXY_HEADER=X-Auth-Request-Email, MD_TRUSTED_PROXIES=172.30.50.10 (this nginx).
#
# Every page is behind the login. Two things can't log in and get their own way through:
# - iPhone Shortcuts: a request to /api/v1/ that fails the login check is
#   passed to the app with no identity header, so only a valid API token works.
# - Calendar apps: /api/calendar.ics, where the secret key in the link is the access.

limit_req_zone $binary_remote_addr zone=md_app:10m rate=20r/s;

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $md_app   http://money-doctor:8000;
    set $md_proxy http://oauth2-proxy:4180;

    set_real_ip_from 172.30.50.20;
    real_ip_header   CF-Connecting-IP;

    client_max_body_size 50m;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY always;
    add_header Referrer-Policy        same-origin always;

    # Set, never passed through: whatever a client sends in this header is
    # replaced. A location with its own proxy_set_header inherits none of
    # these, so those locations repeat Host and X-Real-IP.
    proxy_set_header Host      $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Auth-Request-Email "";

    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Container health check; no login.
    location = /healthz {
        access_log off;
        proxy_pass $md_app;
    }

    location /oauth2/ {
        proxy_pass $md_proxy;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Forwarded-Proto       https;
        proxy_set_header X-Forwarded-Host        $host;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    location = /oauth2/auth {
        internal;
        proxy_pass $md_proxy;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Content-Length    "";
        proxy_pass_request_body off;
    }

    # Home Screen icon and name: iOS fetches these without cookies.
    location ~ ^/(manifest\.webmanifest|apple-touch-icon\.png|icon-(192|512)\.png|favicon\.svg)$ {
        expires 7d;
        access_log off;
        proxy_pass $md_app;
    }

    location = /api/calendar.ics {
        limit_req zone=md_app burst=10 nodelay;
        access_log off;
        proxy_pass $md_app;
    }

    # The website's API calls (logged in) and Shortcuts (API token).
    location /api/v1/ {
        limit_req zone=md_app burst=100 nodelay;
        auth_request /oauth2/auth;
        error_page 401 = @api_token;
        auth_request_set $email $upstream_http_x_auth_request_email;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-Request-Email $email;
        proxy_pass $md_app;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location @api_token {
        proxy_pass $md_app;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ^~ /_app/ {
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        expires 1y;
        access_log off;
        proxy_pass $md_app;
    }

    location / {
        limit_req zone=md_app burst=100 nodelay;
        auth_request /oauth2/auth;
        error_page 401 = /oauth2/sign_in;
        auth_request_set $email       $upstream_http_x_auth_request_email;
        auth_request_set $auth_cookie $upstream_http_set_cookie;
        add_header Set-Cookie $auth_cookie always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        DENY always;
        add_header Referrer-Policy        same-origin always;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Auth-Request-Email $email;
        proxy_pass $md_app;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
