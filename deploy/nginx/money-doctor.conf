# Money Doctor behind nginx, with the app's own password login (MD_AUTH=password).
# Used by the nginx service in compose.example.yml. Traffic arrives from
# cloudflared (or your own HTTPS proxy) as plain HTTP on 8080.
#
# The app is resolved per request, so nginx still starts while the app is down
# (that hostname answers 502 until it's back).

limit_req_zone $binary_remote_addr zone=md_app:10m   rate=20r/s;
limit_req_zone $binary_remote_addr zone=md_login:10m rate=10r/m;

server {
    listen 8080;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $md_app http://money-doctor:8000;

    # The client's real address, for the rate limits. Only cloudflared may set it.
    set_real_ip_from 172.30.50.20;
    real_ip_header   CF-Connecting-IP;

    # Statement PDFs and a year of CSVs come in through the upload page.
    client_max_body_size 50m;
    limit_req_status 429;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options        DENY always;
    add_header Referrer-Policy        same-origin always;

    proxy_set_header Host      $host;
    proxy_set_header X-Real-IP $remote_addr;

    location ~ /\. { deny all; access_log off; log_not_found off; }

    # Container health check; no login.
    location = /healthz {
        access_log off;
        proxy_pass $md_app;
    }

    # Slow down password guessing.
    location = /api/auth/login {
        limit_req zone=md_login burst=5 nodelay;
        proxy_pass $md_app;
    }

    # Subscribed calendar. The secret key is in the query string; keep it out of logs.
    location = /api/calendar.ics {
        limit_req zone=md_app burst=10 nodelay;
        access_log off;
        proxy_pass $md_app;
    }

    # Hashed build assets never change.
    location ^~ /_app/ {
        expires 1y;
        access_log off;
        proxy_pass $md_app;
    }

    location / {
        limit_req zone=md_app burst=100 nodelay;
        proxy_pass $md_app;
        # Uploads are parsed before the response; a year of statements takes a while.
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
